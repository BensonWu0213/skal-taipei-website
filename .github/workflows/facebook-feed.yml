name: Sync Facebook posts → Current Events feed

on:
  schedule:
    # Every 6 hours (UTC). Facebook posts are infrequent; this is plenty.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: facebook-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape public Facebook page → content/facebook-feed.json + public/feed.xml
        env:
          SITE_URL: https://skaltaipei.org.tw
        run: node scripts/fetch-facebook-feed.mjs --limit 40

      - name: Commit changes (only if something changed)
        run: |
          git config user.name "skal-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/facebook-feed.json public/feed.xml public/images/feed
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "chore(feed): sync Facebook posts $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
